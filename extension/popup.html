<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; width: 296px; margin: 0; padding: 14px; color: #1e293b; background: #fff; }
    :focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    h1 img { width: 18px; height: 18px; }
    .capture { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #f7f9fa; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 22px; transition: .2s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: #4f46e5; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .stat b { font-variant-numeric: tabular-nums; }
    #state { font-size: 12px; color: #64748b; margin-top: 10px; min-height: 16px; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; margin-top: 12px; padding: 8px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 13px; cursor: pointer; }
    button.ghost { background: #eef2ff; color: #4f46e5; }
    button:hover { background: #818cf8; }
    button.ghost:hover { background: #e0e7ff; }
    /* 本页媒体 */
    #mediaBox { margin-top: 10px; }
    .media-head { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #16a34a; }
    #mediaList { max-height: 220px; overflow-y: auto; }
    .media-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; margin: 0 -6px; border-bottom: 1px solid #f1f5f9; font-size: 12px; border-radius: 6px; }
    .media-item:hover { background: #f1f5f9; }
    .media-item:last-child { border-bottom: none; }
    .mtag { flex: none; background: #dcfce7; color: #16a34a; border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 700; }
    .mname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msize { flex: none; color: #64748b; font-variant-numeric: tabular-nums; }
    .mdl { flex: none; margin: 0; padding: 3px 10px; font-size: 12px; border-radius: 5px; background: #16a34a; }
    .mdl:hover { background: #22c55e; }
    .mdl:disabled { background: #94a3b8; cursor: default; }
    .mpv { flex: none; margin: 0; padding: 3px 8px; font-size: 12px; border-radius: 5px; background: #eef2ff; color: #4f46e5; }
    .mpv:hover { background: #e0e7ff; }
    /* 预览区 */
    #previewBox { margin-top: 10px; display: none; }
    #previewBox video, #previewBox audio { width: 100%; max-height: 180px; border-radius: 6px; background: #000; display: block; }
    #previewErr { font-size: 12px; color: #dc2626; margin-top: 6px; display: none; }
    #previewName { font-size: 11px; color: #64748b; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 下载前确认模式（popup.html?mode=confirm&token=xxx，360px 独立窗口） */
    #confirmBox { display: none; }
    body.confirm-mode { width: 332px; }
    body.confirm-mode > *:not(#confirmBox) { display: none !important; }
    body.confirm-mode #confirmBox { display: block; }
    .cf-row { margin-bottom: 10px; }
    .cf-row label { display: block; font-size: 12px; color: #64748b; margin-bottom: 3px; }
    .cf-row input, .cf-row select {
      width: 100%; box-sizing: border-box; height: 32px; padding: 0 8px; font-size: 13px;
      border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: inherit;
    }
    .cf-row input:focus, .cf-row select:focus { outline: none; border-color: #818cf8; }
    .cf-row input:focus-visible, .cf-row select:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
    .cf-row input[readonly] { background: #f1f5f9; color: #64748b; }
    #cfState { font-size: 12px; color: #dc2626; min-height: 16px; margin-top: 4px; }
    #confirmBox .row button { box-sizing: border-box; }
    #cfStart { height: 36px; }
    #cfCancel { height: 32px; }
    #cfStart:disabled { background: #94a3b8; cursor: default; }
    @media (prefers-color-scheme: dark) {
      body { background: #16161a; color: #e8e8e8; }
      .capture { background: #2a2a2a; }
      .stat { border-bottom-color: #2a2a2a; }
      #state { color: #888888; }
      button { background: #818cf8; }
      button:hover { background: #a5b4fc; }
      button.ghost { background: #2a2a2a; color: #818cf8; }
      button.ghost:hover { background: #3a3a3a; }
      .media-item { border-bottom-color: #2a2a2a; }
      .media-item:hover { background: #3a3a3a; }
      .mtag { background: #14532d; color: #4ade80; }
      .mdl { background: #16a34a; }
      .mdl:hover { background: #22c55e; }
      .mpv { background: #2a2a2a; color: #818cf8; }
      .mpv:hover { background: #3a3a3a; }
      .msize { color: #888888; }
      #previewName { color: #888888; }
      .cf-row label { color: #888888; }
      .cf-row input, .cf-row select { background: #2a2a2a; border-color: #444444; }
      .cf-row input[readonly] { background: #1f1f23; color: #888888; }
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Rdown</h1>
  <div class="capture">
    <span id="captureLabel" data-i18n="captureLabel">接管浏览器下载</span>
    <label class="switch"><input type="checkbox" id="capture"><span class="slider"></span></label>
  </div>
  <div class="stat"><span data-i18n="statActive">活跃任务</span><b id="active">-</b></div>
  <div class="stat"><span data-i18n="statWaiting">等待任务</span><b id="waiting">-</b></div>
  <div class="stat"><span data-i18n="statSpeed">总下载速度</span><b id="speed">-</b></div>
  <div class="stat"><span data-i18n="statUpspeed">总上传速度</span><b id="upspeed">-</b></div>
  <div id="mediaBox" style="display:none">
    <div class="media-head" id="mediaHead"></div>
    <div id="mediaList"></div>
  </div>
  <button id="deepSearch" class="ghost" type="button" style="width:100%;display:none" data-i18n="deepSearchBtn">深度搜索</button>
  <div id="previewBox">
    <div id="previewName"></div>
    <div id="previewPlayer"></div>
    <div id="previewErr"></div>
  </div>
  <div id="state"></div>
  <div class="row">
    <button id="open" data-i18n="openPanelBtn">管理面板</button>
    <button id="options" class="ghost" data-i18n="settingsBtn">设置</button>
  </div>
  <button id="guide" class="ghost" type="button" style="width:100%" data-i18n="obOpenGuide">使用教程</button>
  <!-- 下载前确认模式表单（?mode=confirm 时才显示，其余 UI 由 CSS 隐藏） -->
  <div id="confirmBox">
    <h1><img src="icons/icon48.png" alt=""><span data-i18n="confirmTitle">确认下载</span></h1>
    <div class="cf-row">
      <label for="cfName" data-i18n="confirmFileName">文件名</label>
      <input type="text" id="cfName">
    </div>
    <div class="cf-row">
      <label for="cfReferer" data-i18n="confirmReferer">来源页面（Referer）</label>
      <input type="text" id="cfReferer" readonly>
    </div>
    <div class="cf-row">
      <label for="cfSplit" data-i18n="confirmSplit">分片数（0 = 服务器默认）</label>
      <input type="number" id="cfSplit" min="0" max="64" step="1" value="0">
    </div>
    <div class="cf-row">
      <label for="cfServer" data-i18n="confirmServer">目标服务器</label>
      <select id="cfServer"></select>
    </div>
    <div id="cfState"></div>
    <div class="row">
      <button id="cfStart" data-i18n="confirmStart">开始下载</button>
      <button id="cfCancel" class="ghost" data-i18n="confirmCancel">取消</button>
    </div>
  </div>
  <script src="vendor/hls.min.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
